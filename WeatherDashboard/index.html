<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-blue-400 to-purple-500 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white bg-opacity-80 rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Weather Dashboard</h1>
    <div class="mb-4">
      <input type="text" id="cityInput" placeholder="Enter city name" class="w-full p-2 rounded border focus:outline-none focus:ring-2 focus:ring-blue-400" />
    </div>
    <button onclick="getWeather()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Search</button>
    
    <div id="weatherInfo" class="mt-6 text-center hidden">
      <h2 class="text-xl font-semibold" id="cityName"></h2>
      <p class="text-lg" id="temperature"></p>
      <p class="text-md text-gray-700" id="description"></p>
      <p class="text-sm text-gray-600" id="location"></p>
      <p class="text-sm text-gray-600" id="humidity"></p>
      <p class="text-sm text-gray-600" id="wind"></p>
      <img id="weatherIcon" class="mx-auto mt-2" />
    </div>
    
    <div id="forecast" class="mt-8 hidden">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">5-Day Forecast</h3>
      <div id="forecastData" class="grid grid-cols-2 gap-4"></div>
    </div>
  </div>

  <script>
    async function getWeather() {
      const city = document.getElementById('cityInput').value;
      const apiKey = '524e613ad80635540965a3287de67df2';

      try {
        const resCurrent = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`);
        if (!resCurrent.ok) throw new Error('City not found');
        const data = await resCurrent.json();

        document.getElementById('weatherInfo').classList.remove('hidden');
        document.getElementById('cityName').textContent = `${data.name}, ${data.sys.country}`;
        document.getElementById('temperature').textContent = `Temperature: ${data.main.temp} °C`;
        document.getElementById('description').textContent = `Condition: ${data.weather[0].description}`;
        document.getElementById('location').textContent = `Coordinates: Lat ${data.coord.lat}, Lon ${data.coord.lon}`;
        document.getElementById('humidity').textContent = `Humidity: ${data.main.humidity}%`;
        document.getElementById('wind').textContent = `Wind Speed: ${data.wind.speed} m/s`;
        document.getElementById('weatherIcon').src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;

        // 5-day forecast
        const resForecast = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric`);
        const forecastData = await resForecast.json();

        const forecastList = forecastData.list.filter(item => item.dt_txt.includes("12:00:00"));
        const forecastContainer = document.getElementById("forecastData");
        forecastContainer.innerHTML = "";

        forecastList.forEach(day => {
          const date = new Date(day.dt_txt);
          const dayCard = `
            <div class="bg-blue-100 p-4 rounded-lg shadow">
              <p class="font-semibold text-gray-700">${date.toDateString()}</p>
              <img src="https://openweathermap.org/img/wn/${day.weather[0].icon}@2x.png" class="mx-auto" />
              <p>${day.main.temp} °C</p>
              <p class="text-sm text-gray-600">${day.weather[0].description}</p>
            </div>
          `;
          forecastContainer.innerHTML += dayCard;
        });

        document.getElementById("forecast").classList.remove("hidden");
      } catch (error) {
        alert(error.message);
        document.getElementById('weatherInfo').classList.add('hidden');
        document.getElementById('forecast').classList.add('hidden');
      }
    }
  </script>
</body>
</html>
